<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#143d30">
  <title>Bazar Zipa 2026 · Evaluación de pitch</title>
  <link rel="stylesheet" href="css/basar.css">
  <script defer src="vendor/supabase-2.45.4.js"></script>
  <script type="module" src="js/basar.js"></script>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <div>
        <p class="date">30 de noviembre de 2026 · Zipaquirá</p>
        <h1>Bazar Zipa 2026</h1>
        <p class="subtitle">Jornada de evaluación de pitch</p>
      </div>
      <img src="bazar.png" alt="Logo de la jornada" width="140" height="112">
    </div>
  </header>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <noscript>Activa JavaScript para acceder a la plataforma.</noscript>
    <section id="access" class="card access" aria-labelledby="access-title" hidden>
      <h2 id="access-title">Acceso a la jornada</h2>
      <form id="login">
        <label>Correo electrónico<input name="email" type="email" autocomplete="username" required></label>
        <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
        <button>Ingresar</button>
      </form>
    </section>
    <section id="dashboard" hidden aria-labelledby="dashboard-title">
      <div class="section-heading">
        <div><h2 id="dashboard-title">Agenda</h2><p id="profile"></p></div>
        <button id="logout" class="secondary">Cerrar sesión</button>
      </div>
      <div id="admin" class="card" hidden>
        <h3>Administración</h3>
        <div class="actions">
          <button id="toggle" disabled></button>
          <button id="export" class="secondary">Exportar a Excel</button>
        </div>
        <details>
          <summary>Cargar agenda</summary>
          <form id="agenda-form">
            <label>Sala<select name="sala" required><option value="1">Sala 1</option><option value="2">Sala 2</option></select></label>
            <label>Participantes y horarios
              <span class="hint">Pega tres columnas sin encabezados: nombre, inicio y fin. Usa fecha y hora de Bogotá en formato AAAA-MM-DD HH:MM para el inicio y HH:MM para el fin.</span>
              <textarea name="rows" rows="4" required></textarea>
            </label>
            <button>Guardar agenda</button>
          </form>
        </details>
      </div>
      <p id="availability" class="notice"></p>
      <div id="agenda" class="card"></div>
      <section id="evaluation" class="card" hidden aria-labelledby="evaluation-title">
        <h3 id="evaluation-title" tabindex="-1"></h3>
        <form id="evaluation-form">
          <div id="criteria"></div>
          <label>Observación final<textarea name="observacion" rows="3" required></textarea></label>
          <div class="actions"><button>Enviar evaluación</button><button type="button" id="cancel" class="secondary">Cancelar</button></div>
        </form>
      </section>
    </section>
  </main>
</body>
</html>
